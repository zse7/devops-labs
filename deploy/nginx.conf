server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ ^/results/[A-Za-z0-9][A-Za-z0-9_-]*[.]json$ {
        default_type application/json;
        disable_symlinks on;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
