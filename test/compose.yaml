services:
  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 1s
      retries: 30
  tools:
    image: node:22-bookworm
    working_dir: /work
    environment:
      REDIS_URL: redis://redis:6379
    volumes:
      - ..:/work
      - dependencies:/work/node_modules
volumes:
  dependencies:
