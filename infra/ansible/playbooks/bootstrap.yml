---
- name: Prepare the permanent administrator
  hosts: lab
  become: true
  gather_facts: true
  vars:
    bootstrap_public_key_path: >-
      {{ playbook_dir }}/../../../.lab/id_ed25519.pub
  pre_tasks:
    - name: Check the target operating system
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Ubuntu'
          - ansible_facts['distribution_version'] == '24.04'
        fail_msg: This playbook is intended for the Ubuntu 24.04 lab VM.
  roles:
    - bootstrap

# Новый play использует admin независимо от пользователя исходного inventory.
- name: Verify a new connection as admin
  hosts: lab
  gather_facts: false
  become: false
  vars:
    ansible_user: admin
  tasks:
    - name: Close any reused SSH connection
      ansible.builtin.meta: reset_connection

    - name: Wait for an authenticated admin connection
      ansible.builtin.wait_for_connection:
        timeout: 60
        connect_timeout: 10

    - name: Read the actual SSH user
      ansible.builtin.command: id -un
      register: bootstrap_login_user
      changed_when: false

    - name: Check that the new connection belongs to admin
      ansible.builtin.assert:
        that:
          - bootstrap_login_user.stdout == 'admin'

    - name: Verify passwordless sudo through the admin connection
      ansible.builtin.command: sudo -n true
      changed_when: false
