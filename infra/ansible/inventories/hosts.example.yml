---
# Документационный IP: CI читает inventory, но не подключается к серверу.
all:
  children:
    lab:
      hosts:
        quotes:
          ansible_host: 192.0.2.10
          ansible_user: admin
          ansible_python_interpreter: /usr/bin/python3
          ansible_ssh_private_key_file: >-
            {{ playbook_dir }}/../../../.lab/id_ed25519
          ansible_ssh_common_args: >-
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile={{ playbook_dir }}/../../../.lab/known_hosts
