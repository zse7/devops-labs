#cloud-config
---
# первоначальная настройка: создать временного пользователя,
# разрешить его ключ, дать sudo и установить питон
users:
  - default
  - name: lab-bootstrap
    shell: /bin/bash
    lock_passwd: true
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    ssh_authorized_keys:
      - "__LAB_SSH_PUBLIC_KEY__"

packages:
  - python3
